name: Rust unit tests

on:
  push:
    branches:
      - master
      - test/sql-auth-validation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  PYTHON_VERSION: "3.13"
  PYO3_PYTHON: python

jobs:
  cargo:
    name: Cargo on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and CPython
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          no-project: true
          enable-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0

      - name: Verify toolchain inputs
        run: |
          rustc --version
          cargo --version
          python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

      - name: Expose managed Python runtime library on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          python_ldlibrary="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LDLIBRARY") or "")')"
          test -n "${python_libdir}"
          test -n "${python_ldlibrary}"
          test -f "${python_libdir}/${python_ldlibrary}"
          echo "LD_LIBRARY_PATH=${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Build through raw Cargo
        run: cargo build --locked

      - name: Run Rust unit tests
        run: cargo test --locked
