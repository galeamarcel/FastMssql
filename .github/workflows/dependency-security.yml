name: Dependency security

on:
  push:
    branches:
      - master
      - test/sql-auth-validation
      - test/operation-metrics-hosted
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install pinned cargo-audit
        run: |
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Reject RustSec vulnerabilities and warnings
        run: scripts/security/audit_dependencies.sh
